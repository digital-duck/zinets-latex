[project]
name = "zitex"
version = "0.3.0"
description = "Typeset Chinese character decompositions in XeLaTeX: equations, matrices and trees from data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wen G. Gong", email = "wen.gong.research@gmail.com" }]
keywords = ["latex", "xelatex", "chinese characters", "hanzi", "decomposition", "cjk", "tikz", "typesetting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["pyyaml", "click", "fonttools"]

[project.urls]
Homepage = "https://github.com/digital-duck/zinets-latex"
Repository = "https://github.com/digital-duck/zinets-latex"
Paper = "https://arxiv.org/abs/2502.19428"

[project.optional-dependencies]
dev = ["pytest"]
pict = ["pillow"]                       # emoji picts: \zimath[pict] draws an emoji into a PNG
ui = ["streamlit>=1.50", "pandas"]      # the review and generate app: streamlit run src/ui/streamlit/app.py

[project.scripts]
zitex = "zitex.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["zitex*"]          # not src/ui: the Streamlit app runs from a checkout, and a top-level "ui" package would clash

[tool.setuptools.package-data]
zitex = ["zitex.sty", "templates/*"]      # the LaTeX package (for `zitex install-sty`) and the files `zitex setup` writes
