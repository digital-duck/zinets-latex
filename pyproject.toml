[project]
name = "zitex"
version = "0.1.0"
description = "Chinese character decomposition trees rendered through XeLaTeX"
requires-python = ">=3.10"
dependencies = ["pyyaml", "click", "fonttools"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
zitex = "zitex.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zitex = ["zitex.sty"]      # the LaTeX package ships inside the Python package, for `zitex install-sty`
